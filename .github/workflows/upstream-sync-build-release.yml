name: Upstream Sync + Build Release

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Build/release even when upstream has no new commits"
        required: false
        default: "false"
      upstream_ref:
        description: "Upstream branch to sync from"
        required: false
        default: "master"
  repository_dispatch:
    types:
      - mesa_drivers_updated

permissions:
  contents: write

jobs:
  sync_upstream:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REF="${{ github.event.inputs.upstream_ref || 'master' }}"
          BEFORE_SHA="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/utkarshdalal/GameNative.git
          git fetch upstream "${UPSTREAM_REF}"
          UPSTREAM_SHA="$(git rev-parse "upstream/${UPSTREAM_REF}")"

          if [ "${UPSTREAM_SHA}" = "${BEFORE_SHA}" ]; then
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            echo "upstream_sha=${UPSTREAM_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git merge --no-ff --no-edit "upstream/${UPSTREAM_REF}"
          git push origin HEAD:master

          echo "updated=true" >> "${GITHUB_OUTPUT}"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "${GITHUB_OUTPUT}"

  build_release:
    needs: sync_upstream
    if: needs.sync_upstream.outputs.updated == 'true' || github.event.inputs.force_release == 'true' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Update manifest driver entry from dispatch payload
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ.get("PAYLOAD_JSON", "{}"))

          def pick_value(src, *paths):
              for path in paths:
                  cur = src
                  ok = True
                  for key in path:
                      if not isinstance(cur, dict) or key not in cur:
                          ok = False
                          break
                      cur = cur[key]
                  if ok and cur not in (None, ""):
                      return str(cur)
              return ""

          driver_id = pick_value(payload, ("id",), ("driver_id",), ("driver", "id"), ("release", "id"))
          driver_name = pick_value(payload, ("name",), ("driver_name",), ("driver", "name"), ("release", "name"))
          driver_url = pick_value(payload, ("url",), ("driver_url",), ("asset_url",), ("driver", "url"), ("release", "url"))
          driver_stack = pick_value(payload, ("driver_stack",), ("stack",), ("driver", "stack"), ("release", "stack"))
          previous_id = pick_value(payload, ("previous_id",), ("old_id",), ("driver", "previous_id"))

          if not (driver_id and driver_name and driver_url):
              print("No complete driver payload found; skipping manifest update.")
              raise SystemExit(0)

          manifest_path = Path("manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          drivers = manifest.get("items", {}).get("driver", [])

          target_index = -1
          stack_prefix = f"{driver_stack}-" if driver_stack else ""
          for idx, item in enumerate(drivers):
              item_id = str(item.get("id", ""))
              item_stack = str(item.get("driverStack", ""))
              if previous_id and item_id == previous_id:
                  target_index = idx
                  break
              if driver_stack and (item_stack == driver_stack or item_id.startswith(stack_prefix)):
                  target_index = idx
                  break

          new_item = {
              "id": driver_id,
              "name": driver_name,
              "url": driver_url,
              "variant": "bionic",
          }
          if driver_stack:
              new_item["driverStack"] = driver_stack

          if target_index >= 0:
              updated = dict(drivers[target_index])
              updated["id"] = driver_id
              updated["name"] = driver_name
              updated["url"] = driver_url
              updated["variant"] = updated.get("variant", "bionic")
              if driver_stack:
                  updated["driverStack"] = driver_stack
              drivers[target_index] = updated
              print(f"Updated driver entry at index {target_index}: {driver_id}")
          else:
              drivers.insert(0, new_item)
              print(f"Inserted new driver entry: {driver_id}")

          manifest["items"]["driver"] = drivers
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit manifest update
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- manifest.json; then
            echo "manifest.json not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: update manifest driver entry from release dispatch"
          git push origin HEAD:master

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app/keystores
          echo "${KEYSTORE}" | base64 --decode > app/keystores/keystore
          {
            echo "storeFile=keystores/keystore"
            echo "keyAlias=${KEYSTORE_KEY_ALIAS}"
            echo "storePassword=${KEYSTORE_STORE_PASSWORD}"
            echo "keyPassword=${KEYSTORE_KEY_PASSWORD}"
          } > app/keystores/keystore.properties

      - name: Configure Production Keystore
        env:
          PROD_KEYSTORE: ${{ secrets.PROD_KEYSTORE }}
          PROD_KEYSTORE_KEY_ALIAS: ${{ secrets.PROD_KEYSTORE_KEY_ALIAS }}
          PROD_KEYSTORE_KEY_PASSWORD: ${{ secrets.PROD_KEYSTORE_KEY_PASSWORD }}
          PROD_KEYSTORE_STORE_PASSWORD: ${{ secrets.PROD_KEYSTORE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app/keystores
          echo "${PROD_KEYSTORE}" | base64 --decode > app/keystores/prod.keystore
          {
            echo "keyAlias=${PROD_KEYSTORE_KEY_ALIAS}"
            echo "keyPassword=${PROD_KEYSTORE_KEY_PASSWORD}"
            echo "storePassword=${PROD_KEYSTORE_STORE_PASSWORD}"
          } > app/keystores/prod-keystore.properties

      - name: Inject credentials
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          CLOUD_PROJECT_NUMBER: ${{ secrets.CLOUD_PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          STEAMGRIDDB_API_KEY="${STEAMGRIDDB_API_KEY:-dummy}"
          CLOUD_PROJECT_NUMBER="${CLOUD_PROJECT_NUMBER:-0}"
          cat <<EOF > local.properties
          STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY}
          CLOUD_PROJECT_NUMBER=${CLOUD_PROJECT_NUMBER}
          EOF

      - name: Install Android SDK Build Tools
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if ! "$SDKMANAGER" --install "build-tools;34.0.0"; then
            yes | "$SDKMANAGER" --install "build-tools;34.0.0"
          fi

      - name: Build release bundle
        run: ./gradlew :app:bundleRelease

      - name: Build universal APK
        run: |
          java -jar tools/bundletool-all-1.17.2.jar build-apks \
            --bundle=app/build/outputs/bundle/release/app-release.aab \
            --output=app-release.apks \
            --mode=universal
          unzip -o app-release.apks universal.apk

      - name: Copy lineage file
        run: |
          mkdir -p app/keystores
          cp prod-debug.lineage app/keystores/prod-debug.lineage

      - name: Dual sign universal APK
        env:
          DEBUG_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          DEBUG_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          DEBUG_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          PROD_ALIAS: ${{ secrets.PROD_KEYSTORE_KEY_ALIAS }}
          PROD_KEY_PASS: ${{ secrets.PROD_KEYSTORE_KEY_PASSWORD }}
          PROD_STORE_PASS: ${{ secrets.PROD_KEYSTORE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_ALIAS}" ] || [ -z "${DEBUG_KEY_PASS}" ] || [ -z "${DEBUG_STORE_PASS}" ] || [ -z "${PROD_ALIAS}" ] || [ -z "${PROD_KEY_PASS}" ] || [ -z "${PROD_STORE_PASS}" ]; then
            echo "Skipping dual-sign: signing secrets are not configured."
            exit 0
          fi
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/34.0.0"
          if [ ! -d "$BUILD_TOOLS_DIR" ]; then
            BUILD_TOOLS_DIR="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          fi
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --lineage app/keystores/prod-debug.lineage \
            --ks app/keystores/keystore \
            --ks-key-alias "${DEBUG_ALIAS}" \
            --ks-pass pass:${DEBUG_STORE_PASS} \
            --key-pass pass:${DEBUG_KEY_PASS} \
            --next-signer --ks app/keystores/prod.keystore \
            --ks-key-alias "${PROD_ALIAS}" \
            --ks-pass pass:${PROD_STORE_PASS} \
            --key-pass pass:${PROD_KEY_PASS} \
            --out universal-signed.apk \
            universal.apk
          mv universal-signed.apk universal.apk

      - name: Create release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%d-%H%M)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          TAG="gamenative-auto-${TS}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "Automated release after upstream sync to ${{ needs.sync_upstream.outputs.upstream_sha }}" \
            universal.apk
